[package]
name = "gef-pcodec-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[lib]
name = "gef_pcodec_ffi"
crate-type = ["staticlib"]

[dependencies]
# Official upstream, not a codec reimplementation. Cargo.lock pins transitives.
pco = "=1.0.2"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
panic = "unwind"
