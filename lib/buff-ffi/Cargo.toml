[package]
name = "buff-ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "buff_ffi"
crate-type = ["staticlib"]

# Original BUFF method bodies, extracted from the pinned authors repository.
[dependencies]
serde = "1"
itertools = "0.9"
lazy_static = "1.4"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
panic = "unwind"
